version: 1
# Дополнение к offers.yaml и 15 методикам агентства, а не замена.
include_offer_catalog: offers.yaml
services:
  - id: S01
    name: Антикризисная диагностика
    purpose: Карта конфликтов, публичных претензий и расхождений в ответах. Результат — решение о действиях, а не выяснение известного девелоперу статуса стройки.
    methods: [M01, M02, M13, M15]
  - id: S02
    name: Подготовка материалов
    purpose: Единая позиция, Q&A, речевые модули, сценарии встреч. Перевод согласованных технических и юридических данных в понятные покупателям ответы.
    methods: [M01, M03, M11, M12]
  - id: S03
    name: Системная работа с дольщиками
    purpose: Регламент ответов, горячая линия, очные встречи, работа с представителями покупателей и учёт обязательств.
    methods: [M02, M04, M05, M08, M10, M14]
  - id: S04
    name: ИИ-мониторинг чатов
    purpose: Мониторинг открытых Telegram, MAX и VK сообществ; сигналы, ежедневные и недельные сводки, карточки событий. Предлагать только при известном открытом сообществе. Доступность конкретного подключения проверять отдельно; не выдавать услугу за уже работающую интеграцию.
    methods: [M06]
  - id: S05
    name: Территориальная конфликтология
    purpose: Добровольное открытое участие жителей, работа с соседями, публичные сообщества, круглые столы и модерируемые встречи. Без скрытых аккаунтов и манипуляций активистами.
    methods: [M07, M08, M09, M11]
  - id: S06
    name: Антикризисные коммуникации
    purpose: Сценарии реагирования, согласование публичной позиции, информационное сопровождение и взаимодействие с органами через уполномоченных представителей.
    methods: [M12, M13, M14, M15]
