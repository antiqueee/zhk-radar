[project]
name = "zhk-radar"
version = "0.1.0"
description = "Доказательный радар проблемных корпусов ЖК"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "SQLAlchemy[asyncio]>=2,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "PyYAML>=6,<7",
    "python-dateutil>=2.9,<3",
    "openpyxl>=3.1,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
    "reportlab>=4,<5",
]

[dependency-groups]
dev = [
    "playwright>=1.50,<2",
    "pypdf>=5,<7",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
