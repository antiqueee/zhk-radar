<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Мегаполис Интеледженс</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/login.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-heading">
      <header class="login-header">
        <a class="brand login-brand" href="/">
          <span class="logo"><img src="/static/megapolis-logo.jpg" alt=""></span>
          <span>Мегаполис <b>Интеледженс</b></span>
        </a>
        <h1 id="login-heading">Вход в рабочий кабинет</h1>
      </header>
      <form id="login-form" class="login-form">
        <label class="field login-field">
          Имя пользователя
          <input name="username" autocomplete="username" required maxlength="64">
        </label>
        <label class="field login-field">
          Пароль
          <input name="password" type="password" autocomplete="current-password"
                 required maxlength="256">
        </label>
        <button class="button primary" type="submit">Войти</button>
        <p id="login-status" role="status"></p>
      </form>
    </section>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
