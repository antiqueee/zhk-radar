<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мегаполис Интеледженс</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header class="header"><a class="brand" href="/" aria-label="Мегаполис Интеледженс — главная"><span class="logo"><img src="/static/megapolis-logo.jpg" alt="Логотип Мегаполис"></span><span>Мегаполис <b>Интеледженс</b></span></a><button class="button quiet" data-action="settings"><span aria-hidden="true">⚙</span> Подключения</button></header>
<main>
<section class="intro"><p class="eyebrow">МОНИТОРИНГ ЖИЛЫХ КОМПЛЕКСОВ</p><h1>Найдите объекты для работы</h1><p class="lead">Поиск в интернете, разбор ситуации и предложение услуг для каждого ЖК.</p></section>
<section class="search-panel" aria-label="Поиск объектов"><div class="search-controls"><label>Где искать<select id="search-region"><option value="capitals">Москва и Санкт-Петербург + области</option value="moscow">Москва и Московская область</option><option value="petersburg">Санкт-Петербург и Ленинградская область</option><option value="russia">Вся Россия</option></select></label><label class="period">Период<select id="search-period"><option value="month">Последний месяц</option><option value="fortnight">Последние 2 недели</option></select></label><button class="button primary" id="find-button" data-action="scan">Найти объекты <span aria-hidden="true">↗</span></button></div><div class="steps"><span><b>1</b> Найдите объекты</span><i>→</i><span><b>2</b> Откройте PDF-разбор</span><i>→</i><span><b>3</b> Уточните по чатам, если нужно</span><button class="button quiet demo-scan" data-action="demo-scan">Попробовать без ключей</button></div></section>
<div id="scan-status" role="status" aria-live="polite"></div>
<section class="results"><div class="results-heading"><div><h2>Объекты <span id="count"></span></h2><p id="data-note"></p></div><div class="results-actions"><select id="dataset" aria-label="Источник объектов"><option value="web">Из интернета</option><option value="imported">Материалы агентства</option><option value="demo">Демо-примеры</option></select><button class="button quiet" data-action="import">Добавить Excel</button></div></div><div class="filter"><input id="filter" type="search" aria-label="Найти в списке" placeholder="Найти ЖК или девелопера в списке"><span id="filter-count"></span></div><div id="records" aria-live="polite"></div><div id="pagination"></div></section>
</main>
<footer><span>Мегаполис Интеледженс</span><span>Внутренний инструмент агентства</span></footer>
<dialog id="detail" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
<dialog id="connections" aria-labelledby="connections-title"><div id="connections-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><input type="file" id="excel-file" accept=".xlsx" hidden><input type="file" id="chat-file" accept=".json" hidden>
<script src="/static/app.js"></script></body></html>
