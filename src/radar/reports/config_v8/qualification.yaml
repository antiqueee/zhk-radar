# Квалификация объекта перед разбором: стоит ли делать PDF и в каком виде.
# Пороги рабочие — подстрой после первых 20–30 объектов.

freshness_months: 12        # «текущая проблематика» — свидетельства не старше этого срока

# Свидетельство — датированная публикация, отзыв или сообщение чата о проблеме из тематического фильтра.
verdicts:
  report_full:              # полный разбор
    min_dated_evidence: 4
    min_contours: 2         # из пяти контуров источников, см. search_plan.yaml
    min_problems_in_scope: 2
  report_compact:           # компактный разбор без страницы «Диагноз»
    min_dated_evidence: 2
    min_contours: 1
    min_problems_in_scope: 1
  watch: {}                 # всё, что ниже: PDF не делается, объект остаётся в реестре под наблюдением

# Что переводит объект в «ручное решение» независимо от числа свидетельств.
hold_if:
  - object_delivered            # дом введён или ключи выданы, а претензии относятся к периоду стройки
  - only_post_delivery_topics   # обсуждают управляющую компанию, нежилые помещения, быт
  - no_solvent_addressee        # застройщик в банкротстве или под арестом, и неясно, кто достраивает
  - developer_unknown           # ни в одном источнике не удалось установить застройщика

# Статус застройщика и кому адресовано предложение.
addressee:
  developer_active:   {client_role: "застройщик"}
  tech_customer:      {client_role: "заказчик"}      # объект достраивает технический заказчик или новый застройщик
  fund_or_city:       {verdict: hold}                # достраивает фонд или город: решает человек
  none:               {verdict: hold}

# Внутренний приоритет считается только для вердиктов report_*; в PDF не выводится.
priority:
  criteria: [острота, публичность]      # каждый 1–3
  high: [5, 6]
  medium: [3, 4]
  low: [2]
