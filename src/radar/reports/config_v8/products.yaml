# Каталог продуктов агентства для поля service и подбор решения под тип проблемы.
# Рабочая редакция: список утверждает владелец агентства.

products:
  position:      "Коммуникации с дольщиками · официальная позиция"
  channel:       "Чат-бот и горячая линия для дольщиков"
  conflictolog:  "Высадка конфликтолога · работа с инициативной группой"
  reviews:       "Мониторинг и отработка негатива"
  monitoring:    "ИИ-мониторинг чатов"
  media:         "Антикризисные коммуникации · работа со СМИ"
  diagnostics:   "Антикризисная диагностика"

# С версии 7 эту таблицу расширяет matrix/problems.yaml (59 проблем, 76 ходов); подбор — tools/matrix.py.
# Какая проблема каким решением закрывается. Решение берётся, только если проблема есть в реестре проблем объекта.
match:
  - {problem: "сроки названы разные или не названы",          solution: "Ответ о сроках",        product: position}
  - {problem: "ответы застройщика шаблонные или их нет",      solution: "Единая позиция",        product: position}
  - {problem: "дольщикам некуда обратиться с вопросом",       solution: "Канал для дольщиков",   product: channel}
  - {problem: "дольщики требуют встречи или идут на акции",   solution: "Офлайн-работа с дольщиками", product: conflictolog}
  - {problem: "есть инициативная группа с требованиями",      solution: "Переговоры с активом",  product: conflictolog}
  - {problem: "негативные отзывы, рейтинг под угрозой",        solution: "Работа с отзывами",     product: reviews}
  - {problem: "о претензиях узнают постфактум",               solution: "Ранний сигнал",         product: monitoring}
  - {problem: "объект в СМИ без позиции заказчика",           solution: "Работа со СМИ",         product: media}

# Решений в разборе от двух до четырёх. Два разбора подряд с одинаковым набором решений —
# повод проверить, что решения выбраны по реестру проблем, а не по привычке.
limits: {min: 2, max: 4}
