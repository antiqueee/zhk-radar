# План поиска проблематики по объекту. Списки открытые: дополняй по мере работы.

# 1. Паспорт объекта собирается до поиска и сохраняется в реестре.
passport_fields:
  - official_name          # как в проектной декларации
  - aliases                # маркетинговые и разговорные названия, старые названия, название очереди
  - developer_brand
  - developer_legal        # юрлицо-застройщик, ИНН
  - tech_customer          # кто фактически строит, если это не застройщик
  - address, district, city
  - phases                 # очереди и корпуса с плановыми сроками
  - official_card_url      # карточка на наш.дом.рф
  - status                 # строится / стройка стоит / введён / ключи выданы — с датой и источником
  - communities            # найденные чаты, каналы, группы, сайты инициативных групп

# 2. Пять контуров источников. По каждому объекту поиск идёт во всех пяти.
contours:
  official:
    gives: "сроки и переносы, готовность, статус застройщика, проверки"
    sources: ["наш.дом.рф", "сайт застройщика: ход строительства и новости", "стройнадзор региона", "ерзрф.ру", "kad.arbitr.ru и Федресурс — только статус и число дел"]
  media:
    gives: "датированные события, позиции сторон, цитаты дольщиков"
    sources: ["городские СМИ: MSK1.RU, Фонтанка, 47news и аналоги в регионе", "отраслевые: Новострой-М, РИА Недвижимость, Интерфакс-Недвижимость, Движение.ру, РБК Недвижимость", "общественные: Активатика"]
  reviews:
    gives: "претензии по темам, тон, повторяемость"
    sources: ["Циан", "Яндекс Недвижимость и Яндекс Карты", "2ГИС", "Новострой-М", "Новостроев", "Avaho", "Отзовик", "Restate", "chatdoma.ru", "форумы новостроек"]
  communities:
    gives: "настроения, планы акций, лидеры, динамика"
    sources: ["Telegram: чаты и каналы", "ВКонтакте: группы дольщиков", "MAX", "сайты инициативных групп", "YouTube и Rutube: видео со стройки и обращения", "петиции"]
  authorities:
    gives: "обращения и ответы на них, внимание политиков"
    sources: ["каналы и сайты депутатов", "публикации партий об объекте", "сообщения прокуратуры и надзора", "мэрия и администрация региона"]

# 3. Матрица запросов: каждое название из aliases × каждая группа лексикона × период.
lexicon:
  сроки:        ["перенос сроков", "срок сдачи", "срок ввода", "выдача ключей", "задержка", "долгострой", "сроки поехали", "кормят завтраками"]
  ход_работ:    ["стройка стоит", "заморожена", "нет рабочих", "ход строительства", "готовность"]
  качество:     ["приёмка", "недоделки", "дефекты", "трещины", "нарушения стройнадзор"]
  деньги:       ["неустойка", "компенсация", "ипотека и аренда", "эскроу", "доплата"]
  документы:    ["допсоглашение", "уведомление о переносе", "односторонний акт", "разрешение на ввод"]
  ответы:       ["не отвечают", "отписки", "горячая линия", "встреча с застройщиком"]
  действия:     ["дольщики", "обманутые дольщики", "инициативная группа", "коллективное обращение", "жалоба", "прокуратура", "пикет", "митинг", "палаточный лагерь", "петиция", "видеообращение"]
  застройщик:   ["банкротство", "арест счетов", "технический заказчик", "смена застройщика", "проблемный объект"]
periods: ["последние 30 дней", "последние 12 месяцев", "без ограничения — только для хронологии"]
query_templates:
  - '"{alias}" {term}'
  - '"{alias}" дольщики {year}'
  - '"{developer_brand}" "{alias}" {term}'
  - 'site:{domain} "{alias}"'          # прицельно по ключевым площадкам контура

# 4. Второй проход: запросы по новым сущностям из первого.
snowball_entities: ["юрлица и технический заказчик", "номера корпусов и очередей", "названия чатов, каналов и групп", "сайты и названия инициативных групп", "ведомства и должности, которые комментировали объект", "названия событий: пикет, лагерь, встреча"]
stop_when:
  max_passes: 2
  min_new_dated_facts_per_pass: 3

# 5. Бюджет на объект: чтобы стоимость разбора оставалась предсказуемой.
budget:
  search_calls: 40
  page_reads: 25
  cache_days: 7            # страницы и результаты поиска кешируются по URL и запросу
