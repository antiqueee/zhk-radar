  - id: A04
    name: "Честный прогноз"
    lever: transparency
    stages: [1, 2, 3]
    scope: [dolshiki]
    product: position
    solution: "Заранее рассказываем не только о планах, но и о рисках: что может сдвинуть срок, как об этом сообщат и что получат дольщики."
    agency: ["Собираем с командой проекта реальные риски срока", "Готовим понятное описание сценариев", "Согласуем, что получают дольщики в каждом", "Доносим до дольщиков и отвечаем на вопросы"]
    developer: ["Раскрывает, от чего зависит срок", "Фиксирует обязательства на случай сдвига", "Даёт спикера от стройки"]
    variants:
      - {name: "Справка", text: "Письмо «от чего зависит срок» с контрольными точками"}
      - {name: "Контрольные точки", text: "Плюс публичные отметки о прохождении каждой точки"}
      - {name: "С обязательством", text: "Плюс заранее объявленная компенсация при срыве точки"}
    outcome: "Новый перенос не становится шоком и поводом для коллективных действий."
    metric: "Контрольные точки, пройденные в срок; реакция на новости."
    basis: "Разъяснение не только выгод, но и рисков"
    cases: [guernica, ltn]

  - id: A05
