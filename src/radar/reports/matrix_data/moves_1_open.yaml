    lever: transparency
    stages: [2, 3, 4]
    scope: [dolshiki, city]
    product: position
    solution: "Собираем все обещания застройщика в один публичный список с датами и отметками об исполнении — и ведём его до ключей."
    agency: ["Поднимаем обещания из писем, встреч и публикаций", "Сверяем с заказчиком, что реально и к какой дате", "Публикуем список и отмечаем исполнение", "Заранее предупреждаем о риске срыва"]
    developer: ["Подтверждает сроки по каждому пункту", "Назначает ответственных", "Сообщает о сдвигах до наступления даты"]
    variants:
      - {name: "Список", text: "Обещания и сроки одним документом для дольщиков"}
      - {name: "С отметками", text: "Публичные статусы «сделано / в работе / перенос» раз в две недели"}
      - {name: "С контролем", text: "Сверку исполнения ведёт совет дольщиков"}
    outcome: "Обещания исполняются на виду; дольщикам незачем вести свой список срывов."
    metric: "Доля обещаний, исполненных в срок."
    basis: "Обещания, исполненные частично и с задержкой, продлевают конфликт на годы"
    cases: [guernica]
    limits: "В список попадает только то, что застройщик готов исполнить к названной дате"
    world_note: "Аргентина: спустя пять лет обещания исполнены частично, протесты идут"

  - id: A06
    name: "Единая позиция"
    lever: transparency
