# Ходы: библиотека решений для страницы «Решения». Часть 1 — прозрачность, участие, предохранители, признание повестки.
# Каждый ход — готовая заготовка карточки решения: поля и лимиты те же, что у offer.modules в разборе.
# Модель подставляет факты объекта в pain и уточняет формулировки, но не меняет продукт, состав колонок и число вариантов.
# scope: dolshiki — конфликт с дольщиками (основной режим сервиса); city — конфликт с жителями вокруг стройки.
# basis — на что ход опирается в книге; world_note — необязательная строка для поля note карточки.

levers:
  transparency:  {name: "Прозрачность",          book: "Превентивные стратегии: раннее раскрытие данных, разъяснение рисков, открытые панели проекта"}
  participation: {name: "Подлинное участие",     book: "Соучастие на ранней стадии, реальные полномочия советов, независимые модераторы и эксперты"}
  safeguards:    {name: "Предохранители",        book: "Независимая конфликтологическая служба, расширенные процедуры, механизмы пересмотра решений"}
  recognition:   {name: "Признание повестки",    book: "Публичное признание проблем, отказ от ярлыков, общая цель как основа переговоров"}
  redesign:      {name: "Пересборка и компенсации", book: "Готовность менять параметры, компенсирующие меры, пробные участки и поэтапность"}
  inclusion:     {name: "Включение лидеров",     book: "Рабочие группы с активом, передача части контроля, адресная работа с группами"}
  narrative:     {name: "Нарратив и символы",    book: "Отказ от бинарных рамок, переопределение проекта как компромисса"}
  external:      {name: "Внешние стороны",       book: "Диалог с банками и инвесторами, работа с вышестоящими инстанциями"}
  monitoring:    {name: "Мониторинг и прогноз",  book: "Предупреждающие сигналы, факторы устойчивости кампаний"}
  crisis:        {name: "Кризис и восстановление", book: "Паузы, структурированный диалог, выход через третью сторону, программа восстановления"}

moves:
  # ───────────── Прозрачность ─────────────
  - id: A01
    name: "Ответ о сроках"
    lever: transparency
    stages: [1, 2, 3]
    scope: [dolshiki]
    product: position
    solution: "Забираем на себя коммуникацию с дольщиками: формулируем официальную позицию по срокам, согласовываем её с заказчиком и доносим до дольщиков."
    agency: ["Забираем на себя коммуникацию с негативно настроенными дольщиками", "Формулируем официальную позицию по срокам", "Помогаем определиться со стратегией с учётом реального положения дел на стройке", "Готовим единые скрипты для продаж и горячей линии", "Запускаем канал для вопросов: чат-бот и горячую линию", "Доносим позицию до дольщиков и собираем реакцию"]
    developer: ["Называет срок выдачи ключей и причины переноса", "Согласует тексты за 48 часов", "Назначает ответственного за согласование ответов дольщикам"]
    variants: []
    outcome: "Публичная официальная позиция, меньше обращений, контроль за реакцией дольщиков."
    metric: "Повторные вопросы о сроках; доля обращений через новый канал."
    basis: "Упреждающая коммуникация решений, которые затрагивают повседневную жизнь"
    cases: [wenlou, yellow_vests, ltn]

  - id: A02
    name: "Панель объекта"
    lever: transparency
    stages: [1, 2, 3, 4]
    scope: [dolshiki, city]
    product: position
    solution: "Запускаем страницу объекта: график работ, готовность по корпусам, фото и видео с площадки, ответы на вопросы — с обновлением по расписанию."
    agency: ["Проектируем страницу под вопросы дольщиков", "Готовим тексты и регламент обновления", "Следим, чтобы обновления выходили в срок", "Собираем вопросы и добавляем ответы"]
    developer: ["Даёт график работ и данные о готовности", "Назначает ответственного за обновления", "Обеспечивает фото и видео с площадки"]
    variants:
      - {name: "Страница", text: "Раздел на сайте объекта с графиком и отчётами раз в две недели"}
      - {name: "С трансляцией", text: "Плюс камеры на площадке и ежемесячный видеоотчёт"}
      - {name: "С вопросами", text: "Плюс публичная лента вопросов дольщиков и ответов на них"}
    outcome: "Ход работ виден без запросов; версии «стройка стоит» не на чем держаться."
    metric: "Обновления в срок; вопросы о ходе работ в чатах."
    basis: "Публичные карты рисков и онлайн-панели проекта; открытые данные как ответ на цифровые кампании"
    cases: [stara_planina, houston]

  - id: A03
    name: "Разъяснение с документами"
    lever: transparency
    stages: [1, 2, 3]
    scope: [dolshiki, city]
    product: position
    solution: "Переводим юридическую позицию застройщика на язык дольщиков: что решено, чем это подтверждается и что из этого следует."
    agency: ["Собираем спорные вопросы и версии из чатов", "Готовим разъяснение с выдержками из документов", "Готовим спикера и единые скрипты для менеджеров", "Доносим позицию до дольщиков и собираем реакцию"]
    developer: ["Передаёт документы по спорному вопросу", "Даёт юриста для сверки формулировок", "Согласует тексты за 48 часов"]
    variants:
      - {name: "Письмо", text: "Официальное разъяснение каждому дольщику с выдержками из документов"}
      - {name: "Видеоответ", text: "Ответ юриста и руководителя проекта на вопросы из чатов"}
      - {name: "Приём юриста", text: "Дни консультаций юриста застройщика для дольщиков"}
    outcome: "Спорный вопрос закрыт документами; меньше оснований для жалоб в надзор."
    metric: "Повторные вопросы по теме; число подготовленных обращений."
    basis: "Публикация исходных данных; процедуры и документы как базовый предохранитель"
