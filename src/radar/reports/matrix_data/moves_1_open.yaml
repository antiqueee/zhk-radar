    scope: [dolshiki, city]
    product: position
    solution: "Сводим ответы продаж, горячей линии, соцсетей и руководства к одной согласованной позиции, чтобы дольщики не сверяли версии."
    agency: ["Собираем, кто и что отвечает дольщикам сейчас", "Готовим единые ответы на частые вопросы", "Обучаем менеджеров и операторов", "Проверяем ответы контрольными обращениями"]
    developer: ["Утверждает позицию на уровне руководства", "Обязывает подразделения отвечать по скриптам", "Назначает одного спикера"]
