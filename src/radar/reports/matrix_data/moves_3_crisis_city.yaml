    agency: ["Подключаем чаты и каналы дольщиков к мониторингу 24/7", "Настраиваем чат-бот: сообщения с риском — заказчику", "Мгновенно выявляем сигналы эскалации", "Раз в неделю даём сводку и рекомендации"]
    developer: ["Назначает получателя сигналов"]
    variants:
      - {name: "Сигналы", text: "Только алармы в чат-бот заказчика"}
      - {name: "Сигналы и сводки", text: "Плюс недельная аналитика по темам"}
      - {name: "С реагированием", text: "Конфликтолог сам отрабатывает сигнал"}
