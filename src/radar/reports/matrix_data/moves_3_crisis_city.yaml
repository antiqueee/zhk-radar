    developer: ["Обязывает подразделения передавать сигналы", "Назначает получателя сводки", "Реагирует на сигнал в согласованный срок"]
    variants:
      - {name: "Журнал", text: "Единый журнал сигналов из всех точек контакта"}
      - {name: "С обучением", text: "Плюс обучение сотрудников распознавать сигналы"}
      - {name: "С выездом", text: "Плюс выезд конфликтолога по сигналу"}
    outcome: "Подготовка к акции или жалобе видна заранее, даже если чаты молчат."
    metric: "Сигналы, полученные до события."
    basis: "При давлении на мессенджеры мобилизация уходит в офлайн: наблюдаемость падает, внезапность растёт"
