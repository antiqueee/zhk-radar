    solution: "Заранее готовим ответы на вероятные шаги дольщиков: обращение, акция, иск, публикация — кто, что и когда делает."
    agency: ["Определяем вероятные шаги группы", "Готовим сценарий ответа на каждый", "Готовим тексты, спикеров, порядок действий", "Проводим тренировку с командой заказчика"]
    developer: ["Утверждает сценарии и ответственных", "Участвует в тренировке", "Действует по сценарию"]
    variants:
