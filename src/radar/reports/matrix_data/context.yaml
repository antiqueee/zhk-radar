# ───────────── Факторы устойчивости протеста (таблица 2 книги) ─────────────
# Чем больше факторов есть у группы, тем меньше шансов, что конфликт затихнет сам.
# Правило прогноза: три и более фактора — в прогнозе стадии нельзя писать, что конфликт затухнет без действий.
factors:
  - id: unity
    name: "Единство"
    essence: "Коалиция разных групп вокруг короткого набора понятных целей"
    signs: ["Один чат на весь объект", "Единый список требований", "Общая символика и лозунг"]
    fails: "Попытки разделить группу и ярлыки «скандалистов»: давление на часть группы сплачивает остальных"
    moves: [F01, B02, D02]
  - id: planning
    name: "Планирование"
    essence: "Чередование шагов и готовность к ответным ходам"
    signs: ["График шагов: претензия, жалобы, акция, иск", "Шаблоны и распределённые роли", "Заготовки на случай отказа"]
    fails: "Расчёт пересидеть: выгорание группы не гарантировано, каждый жёсткий шаг встречает готовый ответ"
    moves: [I05, I03, J01]
  - id: discipline
    name: "Ненасильственная дисциплина"
    essence: "Строгий отказ от насилия и быстрое отмежевание от радикалов"
    signs: ["Запрет на оскорбления и угрозы в чате", "«Семейный» формат акций", "Публичное осуждение крайних шагов"]
    fails: "Жёсткий ответ и разговор об «экстремизме»: на фоне мирной группы он выглядит несоразмерным"
    moves: [J03, D01, B04]
  - id: resources
    name: "Ресурсная база"
    essence: "Деньги, экспертиза, юристы, внешние связи"
    signs: ["Юристы и независимые эксперты", "Сборы денег", "Знакомые журналисты и депутаты"]
    fails: "Расчёт на локальность: спор уходит в федеральную повестку, цена жёстких шагов резко растёт"
    moves: [B05, C03, H02, G01]
  - id: communications
    name: "Коммуникации"
    essence: "Устойчивые каналы связи внутри группы и с внешней аудиторией"
    signs: ["Чаты и каналы с быстрой реакцией", "Фиксация каждого шага застройщика", "Ролики и репортажи с площадки"]
    fails: "Версия о «меньшинстве недовольных» не удерживается; любой инцидент расходится мгновенно"
    moves: [A10, A08, I01]
