# Контекст для прогноза: типы конфликтов, ускорители эскалации, факторы устойчивости протеста.
# Используется на страницах «Диагноз» и «Сценарии и риски» и при подборе ходов.

# ───────────── Типы конфликтов (по книге) ─────────────
# in_service: true — тип входит в текущий тематический фильтр сервиса (сроки, качество, дольщики).
# Остальные типы — городские конфликты вокруг стройки; включаются решением владельца (scope: city).
