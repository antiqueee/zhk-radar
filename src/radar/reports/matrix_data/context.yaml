# ───────────── Ускорители эскалации ─────────────
# Событие, после которого конфликт переходит на следующую стадию быстрее обычного.
# На странице «Сценарии и риски» триггеры берутся из фактов объекта со ссылками; этот список помогает их распознать
# и подсказывает ходы. tree_title и tree_text укладываются в лимиты карточки триггера.
accelerators:
  - {id: T01, name: "Новый перенос без объяснения", sign: "Срок сдвинут, причины и новый порядок не названы", tree_title: "Новый перенос без объяснения", tree_text: "Дольщики узнают о сдвиге не от застройщика и строят версии сами", cases: [wenlou, ltn], moves: [A09, A01, C04]}
