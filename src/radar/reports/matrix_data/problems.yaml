# Реестр проблем → ходы. Расширяет таблицу match из config/products.yaml: 59 проблем вместо восьми.
# Модель сопоставляет проблемы объекта с этим списком (по смыслу, а не по буквальному совпадению) и получает кандидатов.
# moves — в порядке предпочтения: первый — основной ход, следующие — усиление или замена.
# tactics — какие тактики другой стороны обычно стоят за проблемой; avoid — что здесь особенно соблазнительно, но вредно.
# topic — тема из тематического фильтра (config/text_rules.yaml). scope: city — только при включённом городском режиме.

