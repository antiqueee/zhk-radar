# Чего сервис не предлагает никогда. Книга описывает эти приёмы как практику властей и девелоперов
# и фиксирует их последствия: силовые и запретительные ответы чаще усиливают протест, чем гасят его.
# looks_like — как это выглядит у застройщика; why — механизм обратного эффекта по книге; instead — ходы на замену.
# stems — шаблоны (регулярные выражения по тексту в нижнем регистре) для проверки кодом:
# если текст решения подходит под шаблон, решение возвращается на исправление.

antipatterns:
  - id: X01
    name: "Игнорирование и «частный спор»"
    looks_like: "Обращения остаются без ответа; претензии называют частными спорами отдельных дольщиков"
    why: "Заряд копится и выходит внезапным скандалом; устойчивая малая группа способна поменять правила для всех"
    cases: [warsaw, killdozer, shidong]
    instead: [D03, C01, A06]
    stems: []

  - id: X02
    name: "Силовой ответ"
    looks_like: "Охрана, полиция или суд против дольщиков вместо разговора; жёсткие действия в отношении семей с детьми и пожилых"
    why: "Кадры жёсткого ответа становятся символом протеста; юридическая правота репутацию не спасает"
    cases: [moms4housing, guernica, wenlou, zad, chile, haizhu]
    instead: [J04, J03, F08]
    stems: ['силов', 'вызов\w* полици', 'вызвать полици', 'с привлечением охраны', 'вывести дольщик']

  - id: X03
    name: "Давление на активных участников"
    looks_like: "Личные «беседы» с активными дольщиками, звонки работодателю, иски к авторам постов"
    why: "Давление на часть группы сплачивает остальных и даёт протесту героя"
    cases: [wenlou, white_sheets, naim]
    instead: [F01, F06, B02]
    stems: ['давлени\w* на (лидер|актив)', 'надавить на', 'иск\w* к автор', 'через работодател']

  - id: X04
    name: "Зачистка информационного поля"
    looks_like: "Требования удалить ролики и отзывы, жалобы на чаты, закрытые комментарии"
    why: "Контроль над повесткой теряется; обсуждение уходит в закрытые и более радикальные форматы"
    cases: [wenlou]
    instead: [A08, G06, A10]
    stems: ['удал\w* (отзыв|негатив|ролик|публикаци|пост|комментар)', 'блокир\w* (чат|канал|групп)', 'закры\w* комментар', 'снести отзыв', 'зачистк']

  - id: X05
    name: "Дискредитация активных"
    looks_like: "«Скандалисты», «проплаченные», «потребительский экстремизм», «их накручивают юристы»"
    why: "Ярлыки не работают против сплочённой группы и расширяют её аудиторию"
    cases: [rio_tinto, yellow_vests, xr]
    instead: [D01, G02, F01]
    stems: ['потребительск\w* экстремизм', 'проплачен', 'дискредит', 'скандалист', 'компромат']

  - id: X06
    name: "Криминализация"
    looks_like: "Заявления в полицию на дольщиков, угрозы ответственностью за посты и акции"
    why: "Дела рассыпаются, а репутационный и правовой ущерб остаётся; движение выходит из этого опытнее и сильнее"
    cases: [cop_city, sao_paulo, stara_planina, xr, hs2]
    instead: [F08, J03, C02]
    stems: ['заявлени\w* в полицию на', 'уголовн\w* преследовани', 'привле\w* к ответственности дольщик']

  - id: X07
    name: "Ночные и «серые» работы"
    looks_like: "Спорные работы ночью и в выходные; действия без разрешений с расчётом оформить позже"
    why: "Один эпизод становится символом на годы и не закрывается вводом объекта"
    cases: [belgrade]
    instead: [K03, K04, C05]
    stems: ['оформ\w* позже', 'постфактум оформ']

  - id: X08
    name: "Правила под себя"
    looks_like: "Изменение условий задним числом, допсоглашения под давлением, опора на формальные послабления как на главный довод"
    why: "Изменение правил само становится поводом для мобилизации"
    cases: [rio_tinto, houston]
    instead: [A09, C04, E01]
    stems: ['задним числом', '(вынудить|заставить) подписать']

  - id: X09
    name: "«Особо важный проект» вместо диалога"
    looks_like: "«Дом всё равно достроим», «объект на контроле, вопросы излишни»"
    why: "Статус защищает процедуру, но не репутацию: негативная повестка сопровождает проект до конца"
    cases: [liget, zad, hs2, belgrade, vila_autodromo, costa_salguero]
    instead: [D01, D02, A04]
    stems: []

  - id: X10
    name: "Имитация участия"
    looks_like: "Встреча «для галочки», совет из лояльных, опрос без последствий, обсуждение после принятого решения"
    why: "Имитационные форматы бойкотируют; доверие к следующим форматам ниже"
    cases: [ltn]
    instead: [B02, B04, B06]
    stems: ['(совет|группа|актив) из лояльн', 'лояльн\w* совет', 'управляем\w* совет', 'для галочки', 'своих людей в']

  - id: X11
    name: "Косметические уступки"
    looks_like: "Мелкие правки и жесты, не меняющие главного: сроков, статуса, качества"
    why: "Частичные уступки без изменения сути дают «постоянный конфликт» и новый виток"
    cases: [belgrade, stara_planina, yellow_vests, liget]
    instead: [E05, D02, A01]
    stems: []

  - id: X12
    name: "Обещания без исполнения"
    looks_like: "Новые сроки и обещания без графика, ответственных и контроля"
    why: "Обещание, не исполненное к названной дате, продлевает конфликт на годы"
    cases: [guernica]
    instead: [A05, C04, A04]
    stems: []

  - id: X13
    name: "Скрытый раскол актива"
    looks_like: "Сепаратные сделки с отдельными активистами, деление на «конструктивных» и «радикалов»"
    why: "Сплочённую группу трудно разделить; вскрытая сделка усиливает солидарность"
    cases: [zad, xr, yellow_vests]
    instead: [E04, F05, B02]
    stems: ['расколоть', 'раскол\w* актив', 'сепаратн', 'перекупить', 'переманить']
    note: "Адресная работа с группами допустима, когда критерии открыты и одинаковы для всех"

  - id: X14
    name: "Наблюдение как наказание"
    looks_like: "Вход в закрытые чаты под чужим именем, сбор сведений об активных, использование сервисов застройщика против конкретных людей"
    why: "Вскрывшийся контроль сам становится поводом для протеста и уводит общение в офлайн"
    cases: [henan, white_sheets]
    instead: [I01, I02, A10]
    stems: ['под чужим именем', 'под видом (дольщик|жител)', 'от (имени|лица) (дольщик|жител)', 'внедр\w* в чат', 'досье', 'вычислить']
    note: "Мониторинг открытых источников нужен, чтобы быстрее отвечать; он не используется против конкретных людей"

  - id: X15
    name: "Санкции к активным"
    looks_like: "Односторонние акты, отказ в записи на приёмку, встречные иски к самым активным"
    why: "Экономическое давление расширяет коалицию и переводит частный спор в публичный кризис"
    cases: []
    instead: [C03, C02, E04]
    stems: ['встречн\w* иск', 'в отместку', 'наказать']

  - id: X16
    name: "Выжидание"
    looks_like: "«Само рассосётся», «ответим после ввода»; решения откладываются"
    why: "Организованную группу не пересидеть; промедление читается как слабость"
    cases: [chop]
    instead: [J01, G04, I05]
    stems: ['переждать', 'пересидеть', 'само рассос']

  - id: X17
    name: "Сначала жёстко, потом уступка"
    looks_like: "Жёсткий ответ, а затем уступка под давлением"
    why: "Дольщики усваивают, что работает только давление; память о жёстком ответе не стирается"
    cases: [haizhu, naim, white_sheets, wenlou, chile]
    instead: [J02, D01, F08]
    stems: []

  - id: X18
    name: "Жест вместо решения"
    looks_like: "Подарок или скидка вместо ответа о сроках; памятный жест вместо программы"
    why: "Символическая компенсация без реального решения ущерб не закрывает"
    cases: [vila_autodromo]
    instead: [A01, E01, J05]
    stems: []

  - id: X19
    name: "Пиар вместо решения"
    looks_like: "Заказные позитивные публикации и отзывы, «всё идёт по плану» при видимых проблемах"
    why: "Контрнарратив без дел не удерживается; разоблачение бьёт сильнее исходной претензии"
    cases: [vila_autodromo, warsaw, berlin]
    instead: [G05, A02, G06]
    stems: ['накрут', 'заказн\w* (отзыв|публикац)', 'аккаунт для отзыв', 'фейков', 'бот-сет', 'ботов для']

  - id: X20
    name: "Отговорка вместо причины"
    looks_like: "«Технический сбой», «виноват подрядчик» — без разбора и последствий"
    why: "Объяснение без расследования подрывает доверие ко всем следующим объяснениям"
    cases: [henan, belgrade]
    instead: [A03, D04, A04]
    stems: []

  - id: X21
    name: "Закрытые двери"
    looks_like: "Закрытый офис продаж в день визита, запрет доступа на площадку как ответ на вопросы"
    why: "Ролик о закрытых дверях — готовый символ; вопросы уходят в надзор и СМИ"
    cases: []
    instead: [J04, B07, B03]
    stems: ['закры\w* офис', 'не пускать дольщик', 'огранич\w* доступ дольщик']

  - id: X22
    name: "Новые запреты в ответ"
    looks_like: "После конфликта — отмена приёмов и встреч, ужесточение правил общения"
    why: "Запрет не убирает повестку, а переводит её в другие формы и каналы"
    cases: [xr, ltn]
    instead: [C01, B01, C02]
    stems: ['запре\w* встреч', 'отмен\w* приём', 'запрет\w* на обращени']
