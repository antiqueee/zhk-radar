# Что делает другая сторона: 41 тактика в пяти семействах (таблица 1 книги) и шесть типов ответа (таблица 3).
# world — как тактика выглядела в мировых кейсах; ru — как она выглядит у дольщиков (перенос агентства).
# first — ходы первого ответа, then — чем усиливать, avoid — анти-паттерны, которые здесь особенно соблазнительны.

families:
  persuasion:   {name: "Протест и убеждение",          essence: "Публично заявить несогласие и задать свою рамку восприятия проекта"}
  noncoop:      {name: "Несотрудничество",             essence: "Отказать проекту в ресурсах: деньгах, участии, легитимности"}
  intervention: {name: "Ненасильственное вмешательство", essence: "Прямо вмешаться в ход проекта и процедур"}
  alternatives: {name: "Конструктивные альтернативы",  essence: "Создать свои формы управления и контроля, конкурирующие с официальными"}
  everyday:     {name: "Повседневное сопротивление",   essence: "Массовые малозаметные действия, которые тормозят проект и подтачивают доверие"}

# Таблица 3 книги: тип тактики → продуктивный ответ → что будет, если ответ жёсткий.
responses:
  mass:
    name: "Массовые акции высказывания"
    goal: "Публично заявить несогласие, привлечь внимание, собрать коалицию"
    productive: ["Законные форматы для акций", "Открытый диалог с организаторами", "Символические шаги навстречу: паузы, дополнительные встречи", "Включение экспертов другой стороны в обсуждение"]
    if_force: "Потеря легитимности, рост числа участников, выход конфликта за пределы объекта, усиление радикальных групп"
  blocking:
    name: "Блокирование площадок и работ"
    goal: "Физически сдержать работы и поднять издержки проекта"
    productive: ["Пересмотр плана работ", "Временные паузы", "Поиск компромиссных вариантов", "Структурированный диалог с лидерами"]
    if_force: "Кадры жёсткого ответа становятся символом; протест уходит в экономическое и цифровое давление; растёт риск радикализации отдельных групп"
  digital:
    name: "Цифровые кампании"
    goal: "Задать повестку, давить на репутацию, собирать сторонников"
    productive: ["Опережающая прозрачность и открытые данные", "Онлайн-сессии вопросов и ответов", "Проверка фактов", "Платформы обратной связи и корректировок"]
    if_force: "Потеря контроля над повесткой, усиление альтернативных каналов, внешнее внимание; при удалениях и блокировках — уход в анонимные и более радикальные форматы"
  legal:
    name: "Юридические и процедурные тактики"
    goal: "Использовать суды и ведомства, чтобы остановить или изменить проект"
    productive: ["Улучшение качества процедур", "Готовность исправлять выявленные нарушения", "Досудебное урегулирование"]
    if_force: "Копятся судебные решения против застройщика; растёт недоверие к институтам; часть группы переходит к прямому действию"
  economic:
    name: "Экономическое давление"
    goal: "Поднять стоимость проекта и снизить его привлекательность для партнёров"
    productive: ["Диалог с банками и инвесторами", "Пересборка финансовой модели", "Смягчение спорных параметров"]
    if_force: "Отказ инвесторов, заморозка проектов, рост неуправляемых конфликтов; частный спор становится политическим кризисом"
  everyday:
    name: "Повседневное сопротивление"
    goal: "Долго тормозить проект и подрывать его легитимность"
    productive: ["Адресная работа с локальными группами", "Точечные решения", "Участие людей в контроле за исполнением", "Малые проекты, возвращающие доверие"]
    if_force: "Ползучая потеря доверия, хроническая конфликтность любой инициативы, устойчивая культура недоверия и саботажа"

