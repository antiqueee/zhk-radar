name: Конфликтность
min: 1
max: 10
source:
  project: messagesummariser
  file: app/summarizer.py
  constant: DEFAULT_WEEKLY_REPORT_RULES
  verified: '2026-11-16'
anchors:
  1: тишина, почти нет значимых тем, бытовой фон.
  2: есть отдельные бытовые или слабые вопросы без претензий и рисков.
  3: легкий негатив или единичные претензии, без организации и внешних действий.
  4: устойчивые претензии по дому, срокам, качеству, УК или инженерке, но без серьезной
    мобилизации.
  5: 'заметное напряжение: несколько значимых проблем, суды, эскроу, повторяющиеся
    жалобы, эмоциональный негатив, но без сильного офлайн-риска.'
  6: есть офлайн-риски, коллективные жалобы, обращения в СК/прокуратуру/Президенту/жилинспекцию,
    подготовка документов, сбор подписей или локальные инциденты безопасности.
  7: 'высокий репутационный риск: федеральные/международные СМИ, крупный инцидент
    безопасности, несколько острых тем одновременно, активная координация жителей.'
  8: митинг, сбор или акция с датой/местом/организаторами; массовая жалоба с явной
    мобилизацией; радикальные действия, которые могут выйти наружу.
  9: 'кризис уже развернулся: акция состоялась или неизбежна, тема широко разошлась
    в СМИ/органах, есть сильная мобилизация и прямой ущерб репутации.'
  10: 'максимальный кризис: федеральный скандал, силовые/судебные/медийные последствия,
    массовая организованная активность, высокий риск немедленной эскалации.'
aggregation: Оценка периода целиком; сильный медийный или офлайн-инцидент может поднять
  оценку.
comparison_tolerance: 1
rules:
- '6: реальные офлайн-риски или коллективные обращения, в том числе подготовка'
- '7: серьёзный медийный или репутационный удар без организованной акции уровня 8'
- '8: акция с конкретной датой/местом/организацией или событие сравнимой радикальности'
- Бытовой фон и отдельные перепалки не повышают оценку
