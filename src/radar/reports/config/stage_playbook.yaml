# Шкала стадий и дерево сценариев. Модель эти тексты не генерирует, а подставляет.
# Рабочая редакция: состав пакетов, сроки и сложность утверждает владелец агентства.

stages:            # описания стадий одинаковы для всех объектов
  1: {name: "Информационный вакуум", desc: "Нет единого разъяснения, вопросы остаются без ответа"}
  2: {name: "Самоорганизация",       desc: "Дольщики объединяются, собирают претензии и отзывы"}
  3: {name: "Эскалация",             desc: "Коллективные требования, жалобы в надзор, публичные акции"}
  4: {name: "Репутационный кризис",  desc: "Федеральные СМИ, уличные акции, угроза продажам и бренду"}

# Подзаголовок страницы «Предложения» по текущей стадии.
offer_subtitles:
  1: "Локализация конфликта"
  2: "Локализация конфликта"
  3: "Предотвращение кризиса"
  4: "Выход из кризиса"

# Триггер текущей стадии = событие по фактам объекта + чем оно обернётся для заказчика.
# Вторая половина пишется с опорой на эти подсказки: что почувствуют его сотрудники и продажи.
trigger_effects:
  1: ["вопросы копятся без ответа", "сотрудники отвечают по-разному", "дольщики сверяют ответы между собой"]
  2: ["рост звонков на горячую линию", "визиты в офис продаж за разъяснениями", "перегруз сотрудников офиса", "общие требования дольщиков"]
  3: ["проверки и запросы надзора", "публичные акции у офиса и на площадке", "вопросы журналистов"]
  4: ["акции по графику", "обращения к первым лицам", "новые публикации федеральных СМИ"]

# Признаки, по которым ставится стадия. Нужен хотя бы один признак с датой за последние 12 месяцев.
# Нет ни одного признака — стадии нет, объект уходит в наблюдение (см. qualification.yaml).
stage_signs:
  1: ["вопросы дольщиков о сроках без ответа застройщика", "разные ответы от разных сотрудников"]
  2: ["претензии на двух и более площадках", "чат или группа дольщиков с обсуждением претензий", "шаблоны обращений"]
  3: ["коллективное обращение или жалоба в надзор", "пикет, собрание, визит в офис продаж", "публикация в городском СМИ"]
  4: ["публикация в федеральном СМИ", "повторяющиеся уличные акции", "обращения в мэрию, прокуратуру, к президенту", "вмешательство властей"]

# Пакеты действий агентства. cost — сложность от 1 до 5.
packages:
  close_vacuum:
    title: "Закрываем вакуум"
    points: ["Позиция и единые скрипты", "Ответы на вопросы для продаж", "Канал для вопросов дольщиков"]
    result: "Вопросы получают ответ до того, как становятся претензиями"
    term: "2 недели"
    cost: 1
  localize:
    title: "Локализуем за 30 дней"
    points: ["Позиция и единые скрипты", "Одна встреча с дольщиками", "Ответы на отзывы на площадках"]
    result: "Конфликт остаётся рабочим вопросом и не выходит за площадки с отзывами"
    term: "30 дней"
    cost: 1
  campaign:
    title: "Антикризисная кампания"
    points: ["Переговоры с активом дольщиков", "Серия встреч с дольщиками", "Регулярные сводки для дольщиков", "Работа с городскими СМИ", "Ответы на обращения в надзор"]
    result: "Требования сняты, но публикации остаются в выдаче"
    term: "Месяцы"
    cost: 3
  restore:
    title: "Восстановление репутации"
    points: ["Размещения в федеральных СМИ", "Вытеснение негатива из поиска", "Поддержка продаж и бренда"]
    result: "Негатив вытесняется, но остаётся в истории бренда"
    term: "Кварталы"
    cost: 4
  crisis_hq:
    title: "Антикризисный штаб"
    points: ["Единая позиция и спикер", "Регулярные встречи с дольщиками", "Канал информирования дольщиков", "Работа с федеральными СМИ"]
    result: "Протест переходит в переговоры с понятными сроками"
    term: "Кварталы"
    cost: 4
  crisis_campaign:
    title: "Кризисная кампания"
    points: ["Переговоры при посредниках", "Постоянный штаб по дольщикам", "Ответы и опровержения в СМИ"]
    result: "Конфликт управляется, но остаётся в публичном поле"
    term: "Год и более"
    cost: 5
  brand_restart:
    title: "Перезапуск репутации"
    points: ["Новая публичная стратегия", "Долгая кампания в СМИ и поиске", "Работа с банками и партнёрами"]
    result: "Доверие возвращается годами и не полностью"
    term: "Годы"
    cost: 5

# Типовые последствия. Из набора модель выбирает три самых уместных и может подставить название компании.
risk_pools:
  stage_2_3:
    - {title: "Инициативная группа и чаты", text: "Дольщики сверяют ответы и собирают общие претензии"}
    - {title: "Коллективные жалобы в надзор", text: "Проверки и запросы документов, ответы под контролем ведомств"}
    - {title: "Первые публикации в СМИ", text: "Комментарии вдогонку: повестку ведёт редакция"}
  stage_3:
    - {title: "Коллективные жалобы в надзор", text: "Проверки и запросы документов, ответы под контролем ведомств"}
    - {title: "Опубличивание конфликта", text: "Митинги, собрания, визиты в офисы продаж, привлечение партий"}
    - {title: "Публикации в городских СМИ", text: "Комментарии вдогонку: повестку ведёт редакция"}
    - {title: "Видеообращения дольщиков", text: "Ролики к властям расходятся по каналам и попадают в СМИ"}
  stage_4:
    - {title: "Федеральные СМИ и поисковая выдача", text: "Платные размещения в деловых СМИ, вытеснение негатива из поиска"}
    - {title: "Падение продаж следующих очередей", text: "Скидки, акции и рост рекламного бюджета"}
    - {title: "Негатив переходит на другие проекты", text: "Кампания по защите бренда компании целиком"}
    - {title: "Внимание властей", text: "Объект на контроле, встречи и отчёты по графику ведомств"}
  prolonged:
    - {title: "Регулярные уличные акции", text: "Лагеря, пикеты и обращения к первым лицам — уже по графику"}
    - {title: "Политизация конфликта", text: "Партии и депутаты берут дольщиков в свою повестку"}
    - {title: "Внимание надзора и следствия", text: "Проверки, запросы документов, вызовы руководства"}
    - {title: "Иски и взыскания", text: "Судебная нагрузка растёт; основания — к проверке юристом"}
  brand:
    - {title: "Отказы банков и партнёров", text: "Финансирование и подряды — на худших условиях"}
    - {title: "Падение продаж по всем проектам", text: "Клиенты проверяют компанию и уходят к конкурентам"}
    - {title: "Сложности с новыми площадками", text: "Согласования и выход на новые проекты идут труднее"}

# Дерево для каждой текущей стадии: три уровня сверху вниз.
# У первого уровня риски не из набора: это три триггера по фактам объекта со ссылками на источники.
trees:
  1:
    passed: "Конфликт только начинается"
    levels:
      - {n: "1",   stage: 1, tag: "Сейчас",            label: "Действуем сейчас",    package: close_vacuum, risks_label: "Что толкает дальше", risks: triggers}
      - {n: "2–3", name: "Самоорганизация и эскалация", desc: "Дольщики объединяются, появляются коллективные требования", tag: "Если не управлять", label: "Действия на стадиях 2–3", package: campaign, risks_label: "Чем оборачивается", risks: stage_2_3}
      - {n: "4",   stage: 4, tag: "Худший сценарий",   label: "Действия на стадии 4", package: restore,     risks_label: "Чем оборачивается", risks: stage_4}
    price: [{label: "Сейчас", level: 1}, {label: "Эскалация", level: 3}, {label: "Кризис", level: 4}]
  2:
    passed: "1 · Информационный вакуум — пройден"
    levels:
      - {n: "2", stage: 2, tag: "Сейчас",            label: "Действуем сейчас",    package: localize, risks_label: "Что толкает дальше", risks: triggers}
      - {n: "3", stage: 3, tag: "Если не управлять", label: "Действия на стадии 3", package: campaign, risks_label: "Чем оборачивается", risks: stage_3}
      - {n: "4", stage: 4, tag: "Худший сценарий",   label: "Действия на стадии 4", package: restore,  risks_label: "Чем оборачивается", risks: stage_4}
    price: [{label: "Сейчас", level: 1}, {label: "Эскалация", level: 3}, {label: "Кризис", level: 4}]
  3:
    passed: "Стадии 1–2 — пройдены"
    levels:
      - {n: "3", stage: 3, tag: "Сейчас",            label: "Действуем сейчас",    package: campaign, risks_label: "Что толкает дальше", risks: triggers}
      - {n: "4", stage: 4, tag: "Если не управлять", label: "Действия на стадии 4", package: restore,  risks_label: "Чем оборачивается", risks: stage_4}
      - {n: "5", name: "Системный кризис бренда", desc: "Имя компании прочно связано с проблемным объектом", tag: "Худший сценарий", label: "При кризисе бренда", package: brand_restart, risks_label: "Чем оборачивается", risks: brand}
    price: [{label: "Сейчас", level: 3}, {label: "Кризис", level: 4}, {label: "Бренд", level: 5}]
  4:
    passed: "Стадии 1–3 — пройдены"
    levels:
      - {n: "4", stage: 4, tag: "Сейчас",            label: "Действуем сейчас", package: crisis_hq, risks_label: "Что толкает дальше", risks: triggers}
      - {n: "5", name: "Затяжной кризис", desc: "Акции становятся регулярными, тему ведут политики и федеральные СМИ", tag: "Если не управлять", label: "При затяжном кризисе", package: crisis_campaign, risks_label: "Чем оборачивается", risks: prolonged}
      - {n: "6", name: "Системный кризис бренда", desc: "Имя компании прочно связано с проблемным объектом", tag: "Худший сценарий", label: "При кризисе бренда", package: brand_restart, risks_label: "Чем оборачивается", risks: brand}
    price: [{label: "Сейчас", level: 4}, {label: "Затяжной", level: 5}, {label: "Бренд", level: 5}]

price_note: "Сценарии — типовая динамика конфликтов без управления, а не прогноз по объекту. Шкала сложности относительная."
