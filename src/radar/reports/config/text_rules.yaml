# Правила текста, которые проверяются кодом. Каждая правка читателя добавляется сюда и в RULES_LOG.md.

# Служебные оговорки: в PDF недопустимы. Регистр не учитывается.
stop_phrases:
  - "не указан"
  - "не установлен"
  - "не прочитан"
  - "не читал"
  - "не провер"
  - "не выявлен"
  - "не изуч"
  - "не собирал"
  - "неизвестен охват"
  - "охват неизвестен"
  - "актуальность"
  - "один источник"
  - "один тип источника"
  - "гипотеза"
  - "черновик"
  - "нужна проверка"
  - "недостаточно данных"
  - "без дат"
  - "неизвестен"        # о сроке: пишем, что известно, и что из этого следует
  - "пилот"             # работа не ограничивается тридцатью днями; блок называется «Первые 30 дней»

# Внутренние слова продаж: документ читает заказчик.
internal_words: ["приоритет", "окно для захода", "утп", "зайти к девелоперу", "лид", "как зайти"]

# Термины.
replace_terms:
  "покупател": "дольщики"
  "жител": "дольщики"            # кроме цитат
  "цена выхода": "сложность"
forbidden_as_people: ["ДДУ", "ИГ"]   # ДДУ — это договор; люди — «дольщики», «инициативная группа»

# Тематический фильтр.
topics_in_scope:  ["сроки ввода и выдачи ключей", "переносы", "ход работ", "качество и приёмка", "деньги и неустойка", "ответы застройщика", "коллективные действия дольщиков"]
topics_out_of_scope: ["парковки", "экология", "шум", "транспортная доступность", "школы и детские сады", "грунт", "управляющая компания", "нежилые помещения", "соседи"]

# Ключевые факты на первой странице: только число или дата.
fact_value_pattern: '^[0-9IVX][0-9IVX .,/+%₽–-]*( ?(кв\.|мес\.|лет|года?|дн\.|млн|млрд|тыс\.))?( ?[0-9]{2,4})?$'

# Цитата дольщика: содержит претензию, а не представление.
quote:
  min_words: 6
  max_chars: 110

# Утверждения, которые допустимы только со ссылкой на ведомство, суд или СМИ с датой.
# Из отзывов и чатов такие утверждения в PDF не попадают ни в каком виде.
needs_official_or_media: ["банкрот", "арест", "уголовн", "мошеннич", "без разрешения", "незаконн", "притворн", "оспарива", "следств", "суд"]

# Имена частных лиц и фигурантов дел в PDF не выводятся.
no_personal_names: true

# Названия площадок: домен → как писать. Домены в punycode сначала декодируются.
publishers:
  novostroev.ru: "Новостроев"
  novostroy-m.ru: "Новострой-М"
  cian.ru: "Циан"
  2gis.ru: "2ГИС"
  avaho.ru: "Avaho"
  otzovik.com: "Отзовик"
  restate.ru: "Restate"
  msk1.ru: "MSK1.RU"
  realty.ria.ru: "РИА Недвижимость"
  interfax-russia.ru: "Интерфакс"
  dvizhenie.ru: "Движение.ру"
  activatica.org: "Активатика"
  "наш.дом.рф": "Наш.Дом.РФ"
  t.me: "Telegram"
source_types: ["публикация", "отзывы", "карточка объекта", "чат", "канал", "сайт дольщиков", "ведомство"]

# Число упоминаний в «Мониторинге источников» показывается, только если оно не меньше порога.
monitoring_min_count_to_show: 5

# В решениях не предлагается размещение отзывов от имени людей, которые их не писали.
forbidden_in_solutions: ["накрут", "аккаунт для отзыв", "от имени дольщик", "от лица жител"]
